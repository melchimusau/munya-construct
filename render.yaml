services:
  - type: web
    name: munya-construct-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: munya-db
          property: connectionString

databases:
  - name: munya-db
    plan: free